<style>

body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.6;

a { color: inherit; text-decoration: none; }

main { padding: 48px 0 56px; }
.stack { display: flex; flex-direction: column; gap: 56px; }

/* intro */
.who { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }

.who h1 { font-size: 16px; font-weight: 600; }
.who .sub { color: var(--muted); }
.intro p { color: var(--muted); font-size: 15px; line-height: 1.75; margin-bottom: 14px; }

.label a:hover { color: var(--fg); }

.card { background: var(--card); border-radius: 16px; padding: 20px; display: block; }

.card h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.card .role { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.card p { color: var(--muted); font-size: 13.5px; line-height: 1.65; }

/* writing */
.item { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px 20px; align-items: center; padding: 4px 0 26px; }
.item .art { width: 96px; height: 72px; color: var(--accent); justify-self: end; }
.item .art svg { width: 100%; height: 100%; overflow: visible; }

.bob2 { animation: bob 3s ease-in-out -1.2s infinite; }
.sway { transform-origin: 48px 62px; animation: sway 3.4s ease-in-out infinite; }
.slide { animation: slide 3.2s ease-in-out infinite; }
.ping { animation: ping 2.4s ease-in-out infinite; }
.write { stroke-dasharray: 40; animation: write 3s ease-in-out infinite; }

@keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes slide { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
@keyframes ping { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
@keyframes write { 0% { stroke-dashoffset: 40; } 60%,100% { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .item .art * { animation: none !important; } }
@media (max-width: 420px) { .item { grid-template-columns: minmax(0, 1fr) 68px; } .item .art { width: 68px; height: 52px; } }

.item h3 { font-size: 15.5px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 6px; }
a.item:hover h3 { text-decoration: underline; text-underline-offset: 3px; }

.news button { width: 100%; font: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 10px; padding: 11px; }

.news .fine { font-size: 12.5px; color: var(--muted); margin-top: 12px; }
.news .msg { font-size: 13px; margin-top: 10px; }
.news .msg a { text-decoration: underline; }

/* admin */
.adm h1 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.adm .lede { color: var(--muted); margin-bottom: 22px; }
.adm h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 32px 0 12px; }
.adm form { display: grid; gap: 12px; background: var(--card); border-radius: 16px; padding: 20px; }

.adm .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.adm .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.b { font: inherit; font-size: 13.5px; cursor: pointer; border-radius: 10px; padding: 9px 14px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.b.p { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.b.d { color: #A3341F; }
.b:disabled { opacity: .5; cursor: default; }
.arow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }

@media (max-width: 520px) { .adm .two { grid-template-columns: 1fr; } }

footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 12.5px; }
footer .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; }

@media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }

      '<section class="intro"><div class="who"><img class="avatar" src="avatar.webp" alt="Samuel Saji" width="112" height="112"><div><h1>Hey, I\'m Samuel.</h1><div class="sub">AI &amp; software for industry</div></div></div>' +
      '<p>I build AI and software for industry, and I write down what I find along the way: what worked, what did not, and what I would tell someone starting out.</p>' +
      '<p class="small">Not an expert. I am early in all of this and figuring it out as I go, so read it as notes from someone in the middle of the journey. Everything here is written by me, not by AI.</p>' +
      '<div class="links"><span>Kochi, Kerala</span><a href="https://www.linkedin.com/in/samuel-saji/" target="_blank" rel="noopener">LinkedIn ↗</a></div></section>' +
      '<section><div class="label"><span>What I\'m building now</span></div><div class="cards">' + now + '</div></section>' +
      '<section><div class="label"><span>Latest writing</span><a href="#writing">All writing</a></div>' + latest + '</section>' +
      '</div>';
  }

  function viewWriting() {
    var items = sorted().filter(function (e) {
      if (filter === "all") return true;
      if (filter === "note") return e.type === "note";
      return e.topic === filter;
    }).map(itemHtml).join("");
    function chip(k, l) { return '<button class="chip" type="button" data-filter="' + esc(k) + '" aria-pressed="' + (filter === k) + '">' + esc(l) + '</button>'; }
    var chips = chip("all", "All") + topics().map(function (t) { return chip(t, t); }).join("") + chip("note", "Notes");
    return '<h1 class="page-title">Writing</h1><p class="page-lede">Longer essays when something is worth explaining, and short notes in between. Take what is useful.</p>' +
      '<div class="chips">' + chips + '</div>' + items;
  }

  function viewPost(slug) {
    var all = sorted().filter(function (e) { return e.type === "essay"; });
    var e = all.filter(function (x) { return x.slug === slug; })[0];
    if (!e) return null;
    var others = all.filter(function (x) { return x.slug !== slug; }).slice(0, 2).map(itemHtml).join("");
    return '<article class="post"><a class="back" href="#writing">← All writing</a><h1>' + esc(e.title) + '</h1>' +
      '<div class="meta">' + esc(e.when) + ' · ' + esc(e.topic) + ' · ' + readTime(e) + '</div><p class="lede">' + esc(e.sub) + '</p>' +
      '<div class="body">' + e.body.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join("") + '</div>' +
      '<div class="more-posts"><div class="label"><span>More writing</span></div>' + others + '</div>' +
      '</article>';
  }

  function viewAbout() {
    return '<div class="stack"><section class="prose"><h1>About</h1>' +
      '<p>I am Samuel, based in Kochi, Kerala. I started taking on client work while I was still at school and have been building software since. These days I run Codescape, a software company, and I am a co-founder of Edge64, which works on digital twins for industrial automation.</p>' +
      '<p>I finished a BTech in Mechanical Engineering at MACE, Kothamangalam, in 2026.</p>' +
      '<p>I am not an expert in any of this. I am just starting out and working things out as I go, and I write it down as I learn it, including the parts I get wrong.</p>' +
      '<p>Everything on this site is written by me. None of it is written by AI.</p>' +
      '<p>This is not a company site. If something here helped, or you think I got it wrong, say hello on <a href="https://www.linkedin.com/in/samuel-saji/" target="_blank" rel="noopener" style="color:var(--fg);text-decoration:underline">LinkedIn</a>.</p></section>' +
      '</div>';
  }

  var ART_OPTS = [["note", "Notepad"], ["cohort", "People"], ["twin", "Machine"], ["shelf", "Shelf"], ["client", "Seedling"], ["none", "None"]];

  function viewAdmin() {
    if (!canEdit()) {
      return '<div class="adm"><h1>Admin</h1><p class="lede">This page is only for the site owner. If that is you, open the page while signed in to claude.ai.</p></div>';
    }
    var e = editing === "new" ? { type: "essay", date: todayIso(), art: "note" } : (ENTRIES.filter(function (x) { return x.slug === editing; })[0] || null);
    if (editing && !e) editing = null;
    var rows = ENTRIES.slice().sort(function (a, b) { return a.sort < b.sort ? 1 : -1; }).map(function (x) {
      var label = x.type === "note" ? x.text : x.title;
      var asking = flash === "del:" + x.slug;
      return '<div class="arow"><div class="t"><b>' + esc(label) + '</b><span>' + (x.type === "note" ? "Note" : "Essay") + ' · ' + esc(x.when) + '</span></div><div class="btns">' +
        (asking ? '<button class="b d" type="button" data-act="del-yes" data-slug="' + esc(x.slug) + '">Delete for good</button><button class="b" type="button" data-act="del-no">Keep</button>'
                : '<button class="b" type="button" data-act="edit" data-slug="' + esc(x.slug) + '">Edit</button><button class="b d" type="button" data-act="del" data-slug="' + esc(x.slug) + '">Delete</button>') +
        '</div></div>';
    }).join("") || '<p class="hint">No posts yet.</p>';
    var form = "";
    if (e) {
      var isNote = e.type === "note";
      var tl = topics().map(function (t) { return '<option value="' + esc(t) + '">'; }).join("");
      form = '<form id="pf" data-slug="' + esc(e.slug || "") + '">' +
        '<div class="two"><label>Type<select name="type"><option value="essay"' + (!isNote ? " selected" : "") + '>Essay</option><option value="note"' + (isNote ? " selected" : "") + '>Short note</option></select></label>' +
        '<label>Date<input type="date" name="date" value="' + esc(e.date || e.sort || todayIso()) + '" required></label></div>' +
        '<label>Title (essays)<input name="title" value="' + esc(e.title || "") + '" placeholder="What I learned about…"></label>' +
        '<label>One-line summary (essays)<input name="sub" value="' + esc(e.sub || "") + '"></label>' +
        '<div class="two"><label>Topic (essays)<input name="topic" list="tl" value="' + esc(e.topic || "") + '" placeholder="Industrial software"><datalist id="tl">' + tl + '</datalist></label>' +
        '<label>Little drawing<select name="art">' + ART_OPTS.map(function (o) { return '<option value="' + o[0] + '"' + ((e.art || "note") === o[0] ? " selected" : "") + '>' + o[1] + '</option>'; }).join("") + '</select></label></div>' +
        '<label>' + (isNote ? "Note text" : "Body. Leave a blank line between paragraphs.") + '<textarea name="body" placeholder="Write here…">' + esc(isNote ? (e.text || "") : (e.body || []).join("\n\n")) + '</textarea></label>' +
        '<div class="btns"><button class="b p" type="submit">Save post</button><button class="b" type="button" data-act="cancel">Cancel</button></div>' +
        '<p class="hint" style="margin:0">Saving puts it in your draft list. Nothing is public until you press Publish.</p></form>';
    }
    return '<div class="adm"><h1>Admin</h1><p class="lede">Write, edit and delete posts here. Only you can see this page.</p>' +
      (e ? '' : '<div class="btns"><button class="b p" type="button" data-act="new">New post</button><a class="b" href="#">View site</a></div>') +
      form + (e ? '' : '<h2>Your posts</h2>' + rows) +
      '<h2>Newsletter signups</h2><div class="subs" id="subs">Loading…</div>' +
      '<div class="bar" id="pubbar"' + (dirty ? '' : ' hidden') + '><span>You have unpublished changes.</span><button class="b p" type="button" data-act="publish" id="pubbtn">Publish</button></div>' +
      '<p class="hint" id="pubmsg" role="status">' + esc(flashMsg) + '</p></div>';
  }
  var flashMsg = "";

  function loadSubs() {
    var box = document.getElementById("subs"); if (!box || !window.claude) return;
    window.claude.use("db").then(function (db) {
      if (!db) { box.textContent = "Signups are not available in this view."; return; }
      return db.collection("subscribers").orderBy("at", "desc").get().then(function (snap) {
        var list = snap.docs.map(function (d) { return d.data().email; });
        box.innerHTML = list.length ? '<b style="color:var(--fg)">' + list.length + ' subscriber' + (list.length === 1 ? '' : 's') + '</b><br>' + list.map(esc).join("<br>") : "No signups yet.";
      });
    }).catch(function () { box.textContent = "Could not load signups."; });
  }

  function publishNow() {
    var btn = document.getElementById("pubbtn"), msg = document.getElementById("pubmsg");
    btn.disabled = true; msg.textContent = "Publishing…";
    var body = JSON.stringify(ENTRIES, null, 1);
    var cl = window.claude;
    (cl && cl.use ? cl.use("artifact") : Promise.resolve(null)).then(function (a) {
      if (!a) throw { code: "none" };
      return a.publish({ "posts.json": { content: body, contentType: "application/json" } });
    }).then(function () {
      dirty = false; flashMsg = "Published. The live site now shows these posts."; render();
    }).catch(function (err) {
      btn.disabled = false;
      var c = err && err.code;
      flashMsg = c === "conflict" ? "The page was updated elsewhere, so it is reloading. Make your change again." :
        "Could not publish from this page (" + (c || "error") + "). Your changes are kept here. Tell Claude and it will publish them for you.";
      msg.textContent = flashMsg;
    });
  }

  document.addEventListener("submit", function (ev) {
    var f = ev.target; if (!f || f.id !== "pf") return;
    ev.preventDefault();
    var v = function (n) { return (f.elements[n].value || "").trim(); };
    var type = v("type"), date = v("date"), art = v("art"), raw = f.elements.body.value.trim();
    var old = ENTRIES.filter(function (x) { return x.slug === f.getAttribute("data-slug"); })[0];
    var e;
    if (type === "note") {
      if (!raw) { flashMsg = "Write something for the note first."; document.getElementById("pubmsg").textContent = flashMsg; return; }
      e = { type: "note", slug: (old && old.type === "note") ? old.slug : "note-" + Date.now().toString(36), sort: date, date: date, when: fmtDate(date), text: raw, art: art };
    } else {
      var title = v("title");
      if (!title || !raw) { flashMsg = "An essay needs a title and a body."; document.getElementById("pubmsg").textContent = flashMsg; return; }
      var slug = (old && old.type === "essay") ? old.slug : slugify(title);
      if (!old) { var base = slug, n = 2; while (ENTRIES.some(function (x) { return x.slug === slug; })) slug = base + "-" + n++; }
      e = { type: "essay", slug: slug, sort: date, date: date, when: fmtDate(date), topic: v("topic") || "General", title: title, sub: v("sub"),
            body: raw.split(/\n\s*\n/).map(function (x) { return x.trim(); }).filter(Boolean), art: art };
    }
    if (old) ENTRIES[ENTRIES.indexOf(old)] = e; else ENTRIES.push(e);
    dirty = true; editing = null; flashMsg = "Saved to drafts. Press Publish to make it public."; render();
  });

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-act]") : null; if (!t) return;
    var act = t.getAttribute("data-act"), slug = t.getAttribute("data-slug");
    if (act === "new") { editing = "new"; flashMsg = ""; render(); }
    else if (act === "edit") { editing = slug; flashMsg = ""; render(); }
    else if (act === "cancel") { editing = null; render(); }
    else if (act === "del") { flash = "del:" + slug; render(); }
    else if (act === "del-no") { flash = ""; render(); }
    else if (act === "del-yes") { ENTRIES = ENTRIES.filter(function (x) { return x.slug !== slug; }); dirty = true; flash = ""; flashMsg = "Deleted from drafts. Press Publish to make it final."; render(); }
    else if (act === "publish") publishNow();
  });

  document.addEventListener("change", function (ev) {
    var f = ev.target && ev.target.form; if (!f || f.id !== "pf" || ev.target.name !== "type") return;
    var lab = f.elements.body.parentNode; lab.firstChild.nodeValue = ev.target.value === "note" ? "Note text" : "Body. Leave a blank line between paragraphs.";
  });

  var app = document.getElementById("app");
  function render() {
    var h = location.hash.replace(/^#/, ""), html = null, nav = "home";
    if (h === "writing") { html = viewWriting(); nav = "writing"; }
    else if (h === "about") { html = viewAbout(); nav = "about"; }
    else if (h === "admin") { html = viewAdmin(); nav = "admin"; }
    else if (h.indexOf("post-") === 0) { html = viewPost(h.slice(5)); nav = "writing"; }
    if (html === null) { html = viewHome(); nav = "home"; }
    app.innerHTML = html;
    if (h === "admin" && canEdit()) loadSubs();
    document.getElementById("side").style.display = h === "admin" ? "none" : "";
    var al = document.getElementById("adminlink"); if (al) al.style.display = canEdit() ? "" : "none";
    var links = document.querySelectorAll("[data-nav]");
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute("data-nav") === nav) links[i].setAttribute("aria-current", "page"); else links[i].removeAttribute("aria-current");
    }
  }
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });
  document.addEventListener("click", function (ev) {
    var t = ev.target; if (!t.closest) return;
    var f = t.closest("[data-filter]");
    if (f) { filter = f.getAttribute("data-filter"); render(); return; }
    if (t.closest('a[href="#writing"]')) filter = "all";
  });
  render();
  fetch("posts.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (Array.isArray(j)) { ENTRIES = j; if (!dirty) render(); }
  }).catch(function () {});
  if (window.claude && window.claude.use) {
    window.claude.use("user").then(function (u) { USER = u; render(); }).catch(function () {});
  }
})();
</script>

</body>
</html>
